name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tesztek
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Függőségek telepítése (rögzített készlet)
        run: pip install -r requirements.lock
      - name: Függőségek konzisztenciája
        run: pip check
      - name: "Tesztek (hálózat nélkül futnak, rögzített ESPN-mintákkal)"
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Függőségek telepítése (package-lock.json szerint)
        run: npm ci
      - name: Production build
        run: npm run build
